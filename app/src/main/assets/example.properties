# ===================================================
# Chat UI Configuration (Kotlin)
# Matching: .env from Svelte project
# ===================================================
# DO NOT EDIT THIS FILE WITH SENSITIVE DATA
# Use local.properties or settings screen for sensitive values

### API Provider ###
# Available providers: HUGGINGFACE, GOOGLE_VERTEX_AI
# Default: HUGGINGFACE
API_PROVIDER=HUGGINGFACE

### Models ###
# Models are sourced from HuggingFace Router API (114+ models)
# Or Google Vertex AI models
OPENAI_BASE_URL=https://router.huggingface.co/v1

# API Key - HuggingFace token or Google Access Token
OPENAI_API_KEY=YOUR_OPENAI_API_KEY

# hf token
HF_INFERENCE_API=YOUR_HF_TOKEN

# Google studio api key
GOOGLE_STUDIO_API_KEY=YOUR_GOOGLE_STUDIO_API_KEY

### App Configuration ###
PUBLIC_APP_NAME=ChatUI
PUBLIC_APP_DESCRIPTION=Making the communitys best AI chat models available to everyone.

### Default Model (empty = use Omni router to select) ###
DEFAULT_MODEL=
TASK_MODEL=

# ============================================
# LLM Router Configuration (Smart Model Selection)
# ============================================
# Uses HuggingFace Router API for intelligent model routing
LLM_ROUTER_ARCH_BASE_URL=https://router.huggingface.co/v1

# Model used for route selection
LLM_ROUTER_ARCH_MODEL=router/omni

# Fallback model if routing fails
LLM_ROUTER_FALLBACK_MODEL=Qwen/Qwen3-235B-A22B-Instruct-2507

# Route for unmatched requests
LLM_ROUTER_OTHER_ROUTE=casual_conversation

# Timeouts and limits
LLM_ROUTER_ARCH_TIMEOUT_MS=10000
LLM_ROUTER_MAX_ASSISTANT_LENGTH=500
LLM_ROUTER_MAX_PREV_USER_LENGTH=400

# Enable multimodal (image support)
LLM_ROUTER_ENABLE_MULTIMODAL=true

# Enable tools support
LLM_ROUTER_ENABLE_TOOLS=true

### Router UI ###
PUBLIC_LLM_ROUTER_DISPLAY_NAME=Omni
PUBLIC_LLM_ROUTER_ALIAS_ID=omni

### Feature Flags ###
LLM_SUMMARIZATION=true
ENABLE_DARK_MODE=true

### Rate Limits ###
MESSAGES_PER_MINUTE=60
MAX_MESSAGE_LENGTH=4096

# MongoDB removed - using Firebase Firestore instead

### Cloudinary Configuration ###
CLOUDINARY_CLOUD_NAME=YOUR_CLOUD_NAME
CLOUDINARY_API_KEY=YOUR_API_KEY
CLOUDINARY_API_SECRET=YOUR_API_SECRET
CLOUDINARY_UPLOAD_FOLDER=chat-ui/kotlin

# Video Feature Flags
VIDEO_PUBLIC_UPLOAD_ENABLED=true
VIDEO_PRIVATE_UPLOAD_ENABLED=true
VIDEO_IMAGE_TO_VIDEO_ENABLED=true
VIDEO_VIDEO_TO_VIDEO_ENABLED=false
